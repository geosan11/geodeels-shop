<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="blBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#EBF3ED"/>
    </linearGradient>
    <linearGradient id="blWhiteJug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <linearGradient id="blCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#145C2E"/>
      <stop offset="50%" stop-color="#196C36"/>
      <stop offset="100%" stop-color="#0E4220"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#196C36" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#blBg)"/>
  <ellipse cx="200" cy="355" rx="88" ry="14" fill="#145C2E" opacity="0.14"/>

  <g filter="url(#shadow)">
    <!-- Bleach Child-Resistant Cap -->
    <rect x="155" y="48" width="46" height="30" rx="6" fill="url(#blCap)"/>
    <rect x="151" y="74" width="54" height="6" rx="2" fill="#145C2E"/>

    <!-- Asymmetric Jug Neck -->
    <path d="M162 80 L194 80 L200 115 L156 115 Z" fill="url(#blWhiteJug)"/>

    <!-- Heavy-Duty Jug with Large Side Handle -->
    <path d="M156 115 C135 125 125 150 125 180 L125 330 C125 345 138 350 155 350 L245 350 C262 350 275 345 275 330 L275 180 C275 150 250 120 215 115 Z" fill="url(#blWhiteJug)"/>

    <!-- Large Ergonomic Handle Hole Cutout -->
    <path d="M225 145 C255 145 255 240 225 240 L220 220 C238 220 238 165 220 165 Z" fill="#EBF3ED"/>

    <!-- Front Label -->
    <rect x="140" y="185" width="105" height="125" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="140" y="185" width="105" height="26" rx="8" fill="#196C36"/>
    <rect x="140" y="201" width="105" height="10" fill="#196C36"/>
    <text x="192" y="203" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GEODEELS</text>

    <!-- Bleach typography -->
    <text x="192" y="234" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#145C2E" text-anchor="middle">BLEACH</text>
    <text x="192" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#4B5563" text-anchor="middle">MULTIPURPOSE 3.5%</text>
    <line x1="155" y1="258" x2="230" y2="258" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="152" y="266" width="80" height="18" rx="9" fill="#EBF5EE"/>
    <text x="192" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#196C36" text-anchor="middle">WHITENS &amp; DISINFECTS</text>
  </g>
</svg>