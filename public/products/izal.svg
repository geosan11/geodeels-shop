<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#EBF3ED"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A2A1A"/>
      <stop offset="30%" stop-color="#5C4228"/>
      <stop offset="70%" stop-color="#4D3720"/>
      <stop offset="100%" stop-color="#2D1F12"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#145C2E"/>
      <stop offset="50%" stop-color="#196C36"/>
      <stop offset="100%" stop-color="#0E4220"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#196C36" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Base Shadow -->
  <ellipse cx="200" cy="355" rx="90" ry="14" fill="#145C2E" opacity="0.15"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="175" y="45" width="50" height="30" rx="6" fill="url(#capGrad)"/>
    <rect x="171" y="70" width="58" height="8" rx="3" fill="#145C2E"/>
    
    <!-- Neck -->
    <path d="M182 78 L218 78 L222 110 L178 110 Z" fill="url(#bottleGrad)"/>

    <!-- Jug Body / Shoulders -->
    <path d="M178 110 C150 115 130 135 130 165 L130 330 C130 345 142 350 160 350 L240 350 C258 350 270 345 270 330 L270 165 C270 135 250 115 222 110 Z" fill="url(#bottleGrad)"/>
    
    <!-- Handle -->
    <path d="M260 150 C295 160 295 240 260 250 L256 225 C275 220 275 180 256 175 Z" fill="#3D2B1A"/>

    <!-- Bottle Sheen -->
    <path d="M145 160 L145 330 C145 335 148 340 152 340 L156 340 L156 160 Z" fill="#FFFFFF" opacity="0.15"/>

    <!-- Product Label -->
    <rect x="145" y="175" width="110" height="135" rx="8" fill="#FFFFFF"/>
    <rect x="145" y="175" width="110" height="28" rx="8" fill="#196C36"/>
    <rect x="145" y="195" width="110" height="8" fill="#196C36"/>
    <text x="200" y="194" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GEODEELS</text>
    
    <!-- Label Content -->
    <text x="200" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#196C36" text-anchor="middle">IZAL</text>
    <text x="200" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#4B5563" text-anchor="middle">GERMICIDE FLUID</text>
    <line x1="165" y1="252" x2="235" y2="252" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="200" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#145C2E" text-anchor="middle">99.9% SANITISING</text>
    <text x="200" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#6B7280" text-anchor="middle">CONCENTRATED FORMULA</text>
  </g>
</svg>