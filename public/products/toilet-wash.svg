<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="twBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#EBF3ED"/>
    </linearGradient>
    <linearGradient id="twBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#145C2E"/>
      <stop offset="35%" stop-color="#196C36"/>
      <stop offset="70%" stop-color="#1E7A3E"/>
      <stop offset="100%" stop-color="#145C2E"/>
    </linearGradient>
    <linearGradient id="twCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E4220"/>
      <stop offset="50%" stop-color="#145C2E"/>
      <stop offset="100%" stop-color="#082813"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#196C36" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#twBg)"/>
  <ellipse cx="200" cy="355" rx="85" ry="14" fill="#145C2E" opacity="0.15"/>

  <g filter="url(#shadow)">
    <!-- Angled Spout & Cap -->
    <path d="M195 40 L230 50 L222 75 L187 65 Z" fill="url(#twCap)"/>
    <!-- Angled Neck -->
    <path d="M188 67 L220 76 L205 115 L175 110 Z" fill="url(#twBottle)"/>

    <!-- Ergonomic Main Bottle -->
    <path d="M175 110 C150 120 135 150 135 180 L135 330 C135 345 150 350 170 350 L230 350 C250 350 265 345 265 330 L265 180 C265 145 240 120 205 115 Z" fill="url(#twBottle)"/>

    <!-- Grip Ridges -->
    <rect x="133" y="145" width="8" height="6" rx="3" fill="#145C2E"/>
    <rect x="133" y="158" width="8" height="6" rx="3" fill="#145C2E"/>
    <rect x="133" y="171" width="8" height="6" rx="3" fill="#145C2E"/>

    <!-- Sheen -->
    <path d="M148 180 L148 330 C148 335 150 340 155 340 L158 340 L158 180 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Label -->
    <rect x="150" y="195" width="100" height="120" rx="10" fill="#FFFFFF"/>
    <rect x="150" y="195" width="100" height="26" rx="10" fill="#145C2E"/>
    <rect x="150" y="211" width="100" height="10" fill="#145C2E"/>
    <text x="200" y="213" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GEODEELS</text>

    <text x="200" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#196C36" text-anchor="middle">TOILET</text>
    <text x="200" y="259" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#196C36" text-anchor="middle">WASH</text>
    <text x="200" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#4B5563" text-anchor="middle">ACTIVE THICK FORMULA</text>
    <rect x="165" y="285" width="70" height="18" rx="9" fill="#EBF5EE"/>
    <text x="200" y="297" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#196C36" text-anchor="middle">EXTRA SHINE</text>
  </g>
</svg>