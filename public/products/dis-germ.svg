<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#EBF3ED"/>
    </linearGradient>
    <linearGradient id="dgLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E5F0E"/>
      <stop offset="40%" stop-color="#CA7D14"/>
      <stop offset="70%" stop-color="#BA7110"/>
      <stop offset="100%" stop-color="#804B06"/>
    </linearGradient>
    <linearGradient id="dgCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#145C2E"/>
      <stop offset="50%" stop-color="#196C36"/>
      <stop offset="100%" stop-color="#0E4220"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#196C36" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#dgBg)"/>
  <ellipse cx="200" cy="355" rx="75" ry="14" fill="#145C2E" opacity="0.14"/>

  <g filter="url(#shadow)">
    <!-- Measuring / Security Cap -->
    <rect x="178" y="55" width="44" height="28" rx="6" fill="url(#dgCap)"/>
    <rect x="174" y="80" width="52" height="6" rx="2" fill="#145C2E"/>

    <!-- Bottle Neck -->
    <rect x="185" y="86" width="30" height="25" fill="url(#dgLiquid)"/>

    <!-- Disinfectant Oval Shouldered Bottle -->
    <path d="M185 111 C155 120 142 145 142 180 L142 325 C142 342 155 350 172 350 L228 350 C245 350 258 342 258 325 L258 180 C258 145 245 120 215 111 Z" fill="url(#dgLiquid)"/>

    <!-- Light Sheen Reflection -->
    <path d="M152 170 L152 320 C152 328 156 335 160 335 L164 335 L164 170 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Medical Shield Label -->
    <rect x="154" y="175" width="92" height="130" rx="8" fill="#FFFFFF"/>
    <rect x="154" y="175" width="92" height="24" rx="8" fill="#196C36"/>
    <rect x="154" y="190" width="92" height="9" fill="#196C36"/>
    <text x="200" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GEODEELS</text>

    <!-- Cross Graphic -->
    <rect x="194" y="206" width="12" height="24" rx="2" fill="#196C36"/>
    <rect x="188" y="212" width="24" height="12" rx="2" fill="#196C36"/>

    <text x="200" y="254" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#145C2E" text-anchor="middle">DIS-GERM</text>
    <text x="200" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#4B5563" text-anchor="middle">DISINFECTANT FLUID</text>
  </g>
</svg>