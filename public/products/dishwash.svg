<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#EBF3ED"/>
    </linearGradient>
    <linearGradient id="dwLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#228B47"/>
      <stop offset="50%" stop-color="#2EB85C"/>
      <stop offset="100%" stop-color="#1E7A3E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#196C36" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#dwBg)"/>
  <ellipse cx="200" cy="355" rx="80" ry="14" fill="#145C2E" opacity="0.14"/>

  <g filter="url(#shadow)">
    <!-- Dispenser Pump / Push Cap -->
    <rect x="188" y="38" width="24" height="22" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <path d="M175 42 L215 42 L225 50 L175 50 Z" fill="#196C36"/>
    <rect x="193" y="60" width="14" height="25" fill="#E5E7EB"/>
    <rect x="180" y="85" width="40" height="15" rx="4" fill="#196C36"/>

    <!-- Clear Contoured Bottle Body -->
    <path d="M180 100 C155 115 140 145 140 180 C140 220 152 245 146 270 L144 330 C144 345 158 350 175 350 L225 350 C242 350 256 345 256 330 L254 270 C248 245 260 220 260 180 C260 145 245 115 220 100 Z" fill="url(#dwLiquid)"/>

    <!-- Specular Highlight -->
    <path d="M152 140 C148 180 148 300 154 335 L160 335 C155 295 155 180 160 140 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- Front Label -->
    <rect x="155" y="180" width="90" height="125" rx="10" fill="#FFFFFF"/>
    <rect x="155" y="180" width="90" height="26" rx="10" fill="#196C36"/>
    <rect x="155" y="196" width="90" height="10" fill="#196C36"/>
    <text x="200" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GEODEELS</text>

    <!-- Label typography -->
    <text x="200" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#145C2E" text-anchor="middle">DISHWASH</text>
    <text x="200" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#196C36" text-anchor="middle">LIQUID</text>
    <text x="200" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#4B5563" text-anchor="middle">POWER DEGREASER</text>
    <rect x="168" y="270" width="64" height="18" rx="9" fill="#EBF5EE"/>
    <text x="200" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#145C2E" text-anchor="middle">LEMON FRESH</text>
  </g>
</svg>